[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "study-search"
version = "0.1.0"
description = "Ask questions across your lecture PDFs and PowerPoints, answered locally with citations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3",
    "langchain-community>=0.3,<0.5",
    "langchain-text-splitters>=0.3",
    "langchain-ollama>=0.2",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "pypdf>=4",
    "python-pptx>=1.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
cloud = ["langchain-openai>=0.2"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
study-search = "studysearch.cli:main"

[tool.setuptools]
packages = ["studysearch"]
